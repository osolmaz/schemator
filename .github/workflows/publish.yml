name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedName = "@osolmaz/schemator";
          const expectedRepository = "https://github.com/osolmaz/schemator";
          const repository = String(pkg.repository?.url ?? "")
            .replace(/^git\+/, "")
            .replace(/\.git$/, "");
          const errors = [];

          if (pkg.name !== expectedName) {
            errors.push(`package name must be ${expectedName}; found ${pkg.name ?? "<missing>"}`);
          }
          if (repository !== expectedRepository) {
            errors.push(`repository must be ${expectedRepository}; found ${repository || "<missing>"}`);
          }
          if (pkg.publishConfig?.access !== "public") {
            errors.push("publishConfig.access must be public");
          }
          if (pkg.bin?.schemator !== "dist/cli.js") {
            errors.push("bin.schemator must be dist/cli.js");
          }
          if (errors.length) {
            errors.forEach((error) => console.error(error));
            process.exit(1);
          }
          NODE
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "release commit is not contained in $DEFAULT_BRANCH" >&2
            exit 1
          fi
          if npm view "@osolmaz/schemator@$version" version >/dev/null 2>&1; then
            echo "@osolmaz/schemator@$version is already published" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm publish --access public --provenance
